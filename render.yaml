services:
  # ── PHP Web App ─────────────────────────────────────────────
  - type: web
    name: rank-chat-web
    runtime: php
    buildCommand: ""
    startCommand: php -S 0.0.0.0:$PORT index.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: VOICE_SECRET
        sync: false
      - key: VOICE_SERVER_URL
        sync: false

  # ── Node.js Voice Server ────────────────────────────────────
  - type: web
    name: rank-chat-voice
    runtime: node
    rootDir: voice-server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: "3001"
      - key: VOICE_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: RATE_LIMIT_MAX
        value: "50"
